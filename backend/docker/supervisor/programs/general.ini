[program:general]
command=php artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=900 --memory=%(ENV_WORKER_MEMORY)s --max-time=3600 --no-interaction
directory=/var/www/html
numprocs=%(ENV_GENERAL_WORKERS)s
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=930
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
