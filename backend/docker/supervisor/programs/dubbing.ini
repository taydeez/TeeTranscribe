[program:dubbing]
command=php artisan queue:work dubbing --queue=dubbing --sleep=3 --tries=3 --timeout=5400 --memory=%(ENV_WORKER_MEMORY)s --max-time=86400 --no-interaction
directory=/var/www/html
autostart=true
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=5430
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
