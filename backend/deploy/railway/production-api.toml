# Set Railway Root Directory to /backend and Config File Path to /backend/deploy/railway/production-api.toml.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.production"

[deploy]
startCommand = "/usr/local/bin/start-service api"
preDeployCommand = ["php artisan migrate --force --no-interaction"]
healthcheckPath = "/up"
healthcheckTimeout = 120
restartPolicyType = "ALWAYS"
numReplicas = 1
drainingSeconds = "30"
